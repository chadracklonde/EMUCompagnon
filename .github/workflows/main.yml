name: Build APK

# Se déclenche à chaque push sur main, à chaque pull request, et peut aussi
# être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (release)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # uniquement pour enregistrer pubspec.lock s'il manque

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          # Version figée : un build d'aujourd'hui doit rester reproductible
          # demain. Pour mettre à jour Flutter, changer ce numéro
          # volontairement (et relire les résultats des tests).
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Générer les dossiers natifs (android/ios) si absents
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,ios,web --org com.emucompagnon --project-name emu_compagnon /tmp/scaffold
            cp -r /tmp/scaffold/android .
            cp -r /tmp/scaffold/ios .
            cp -r /tmp/scaffold/web .
            chmod +x android/gradlew
          fi
          # NB : on ne force plus manuellement les versions AGP/Kotlin/Gradle.
          # Le scaffold fraîchement généré par ce Flutter (channel stable)
          # embarque déjà des versions mutuellement compatibles — les forcer
          # à des versions plus anciennes créait des combinaisons invalides
          # et des échecs en cascade.
          # Nom affiché sous l'icône et dans la liste des applications.
          # flutter create y met le nom technique du projet
          # ("emu_compagnon") ; on le remplace par le vrai nom de l'app.
          sed -i 's/android:label="[^"]*"/android:label="ÉMU Compagnon"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          # Ajoute la permission POST_NOTIFICATIONS (Android 13+), requise
          # par flutter_local_notifications et non ajoutée automatiquement
          # au scaffold généré par flutter create.
          if ! grep -q "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>#' android/app/src/main/AndroidManifest.xml
          fi
          # Ajoute la permission INTERNET. Flutter ne l'ajoute PAS par
          # défaut au manifeste de release (seulement au manifeste de
          # debug, pour le VM service) — un développeur doit la déclarer
          # lui-même. Sans elle, TOUT appel réseau de l'app (vérification
          # de mise à jour du contenu, téléchargement des polices Google
          # Fonts au premier lancement, etc.) est bloqué par le système,
          # ce qui peut faire planter l'app au démarrage si l'erreur n'est
          # pas interceptée. C'était absent du manifeste de la version
          # envoyée en production (confirmé en inspectant les permissions
          # réelles de l'APK buildé par ce workflow).
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          fi
          # Active le "core library desugaring", requis par
          # flutter_local_notifications (utilise des API Java 8+) et
          # jamais activé par défaut dans le scaffold généré.
          if ! grep -q "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          fi
          # NB : la version de file_picker utilisée (>=10.3.10, voir
          # pubspec.yaml) référence déjà "flutter.compileSdkVersion"
          # dynamiquement — plus besoin de patcher le compileSdk ici.
          # Les versions antérieures (8.x) le figeaient en dur à 34,
          # ce qui cassait la compilation avec les plugins récents
          # (ex. flutter_plugin_android_lifecycle exigeant 36) sans
          # qu'aucune configuration Gradle de notre côté ne puisse le
          # corriger — la vraie source du problème était la version du
          # package, pas la configuration.

      - name: Configurer la signature de production (si les secrets existent)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # NB : la vérification "si les secrets existent" se fait ICI, en
          # bash (via [ -n "$KEYSTORE_BASE64" ]), et non via un "if:" YAML
          # au niveau de l'étape — GitHub Actions refuse la syntaxe
          # "if: ${{ secrets.X != '' }}" au niveau d'une étape avec l'erreur
          # "Unrecognized named-value: 'secrets'". Le contexte "secrets"
          # n'est utilisable qu'à l'intérieur d'un bloc env:/with:, pas
          # dans une expression if: — solution robuste : le lire depuis la
          # variable d'environnement à l'intérieur du script.
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Sans ceci, chaque run CI signe avec une clé de debug ALÉATOIRE
            # régénérée à chaque fois (runner neuf à chaque build), donc deux
            # builds successifs n'ont jamais la même signature — ce qui fait
            # échouer toute mise à jour sur un store (Play Store, APKPure...)
            # qui vérifie la cohérence de signature entre versions. Ce bloc
            # signe avec une clé stable et persistante à la place.
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/emu-compagnon-release.jks
            cat > android/key.properties << PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=emu-compagnon-release.jks
          PROPS

            sed -i '1i\
          import java.util.Properties\
          import java.io.FileInputStream\
          ' android/app/build.gradle.kts

            sed -i '/^android {/i\
          val keystorePropertiesFile = rootProject.file("key.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' android/app/build.gradle.kts

            sed -i '/^android {/a\
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String?\
                      keyPassword = keystoreProperties["keyPassword"] as String?\
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }\
                      storePassword = keystoreProperties["storePassword"] as String?\
                  }\
              }' android/app/build.gradle.kts

            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' android/app/build.gradle.kts
          else
            echo "Aucun secret de signature trouvé — build signé avec la clé de debug (normal si les secrets ne sont pas encore configurés)."
          fi

      - name: Vérifier l'environnement
        run: flutter doctor -v

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Version de Flutter utilisée
        run: |
          flutter --version | head -2
          echo "::notice title=Flutter::$(flutter --version | head -1) / $(flutter --version | sed -n 3p)"

      - name: Conserver pubspec.lock (versions exactes des dépendances)
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock

      - name: Enregistrer pubspec.lock dans le dépôt (une seule fois)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git ls-files pubspec.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f pubspec.lock
            git commit -m "Ajout de pubspec.lock (versions exactes des dépendances) [skip ci]"
            git push origin HEAD:main || echo "::warning::Impossible d'enregistrer pubspec.lock"
          fi

      - name: Exécuter les tests automatisés (bloquant)
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          out=$(tail -n 25 /tmp/test.log | sed 's/%/%25/g' | tr '\n' '|')
          echo "::notice title=Résultat flutter test::$out"
          exit $code

      - name: Générer les icônes de l'app
        shell: bash
        run: |
          set +e
          dart run flutter_launcher_icons -f icons-android.yaml > icon_gen.log 2>&1
          status=$?
          cat icon_gen.log
          if [ $status -ne 0 ]; then
            {
              echo '### Diagnostic : erreur de génération des icônes'
              echo '```'
              cat icon_gen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Publier le log de génération des icônes (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-gen-log-android-build
          path: icon_gen.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Analyser le code (non bloquant)
        run: flutter analyze || true

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Construire l'App Bundle (pour le Play Store)
        run: flutter build appbundle --release

      # Rend l'APK téléchargeable depuis l'onglet "Actions" > ce run,
      # même sans créer de release GitHub.
      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publier l'App Bundle comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # --- Version Web ---
      - name: Installer les binaires SQLite pour le Web
        run: dart run sqflite_common_ffi_web:setup

      - name: Construire la version Web
        run: flutter build web --release

      - name: Publier la version Web comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-web
          path: build/web
          retention-days: 30

  build-windows:
    name: Build Windows (release)
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          # Version figée : un build d'aujourd'hui doit rester reproductible
          # demain. Pour mettre à jour Flutter, changer ce numéro
          # volontairement (et relire les résultats des tests).
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      # shell: bash explicite — windows-latest utilise PowerShell par
      # défaut, mais Git pour Windows (inclus sur ces runners) fournit
      # bash.exe, ce qui permet de garder la même syntaxe que les autres
      # jobs sans tout réécrire en PowerShell.
      - name: Générer le dossier natif windows/ si absent
        shell: bash
        run: |
          if [ ! -d "windows" ]; then
            flutter create --platforms=windows --org com.emucompagnon --project-name emu_compagnon /tmp/scaffold
            cp -r /tmp/scaffold/windows .
          fi
          # Titre de la fenêtre et description du .exe : flutter create y met
          # le nom technique du projet ("emu_compagnon"). Les commandes ne
          # font rien (sans erreur) si le motif n'existe pas.
          sed -i 's/L"emu_compagnon"/L"\\u00c9MU Compagnon"/' windows/runner/main.cpp || true
          sed -i 's/"emu_compagnon"/"EMU Compagnon"/' windows/runner/Runner.rc || true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        shell: bash
        run: |
          set +e
          dart run flutter_launcher_icons -f icons-windows.yaml > icon_gen.log 2>&1
          status=$?
          cat icon_gen.log
          if [ $status -ne 0 ]; then
            {
              echo '### Diagnostic : erreur de génération des icônes'
              echo '```'
              cat icon_gen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Publier le log de génération des icônes (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-gen-log-windows
          path: icon_gen.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Construire l'app Windows
        run: flutter build windows --release

      # NB : depuis Flutter 3.15+, le chemin de sortie inclut
      # l'architecture cible (x64) — build/windows/x64/... et non plus
      # l'ancien build/windows/runner/... (changement cassant à connaître
      # si un jour cette étape échoue après une mise à jour de Flutter).
      - name: Publier l'app Windows comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-windows
          path: build/windows/x64/runner/Release
          retention-days: 30

  build-macos:
    name: Build macOS (release)
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          # Version figée : un build d'aujourd'hui doit rester reproductible
          # demain. Pour mettre à jour Flutter, changer ce numéro
          # volontairement (et relire les résultats des tests).
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Générer le dossier natif macos/ si absent
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos --org com.emucompagnon --project-name emu_compagnon /tmp/scaffold
            cp -r /tmp/scaffold/macos .
          fi
          # Nom affiché sous l'icône / dans le Finder : "ÉMU Compagnon".
          # (PRODUCT_NAME n'est pas modifié, pour ne pas changer le nom du
          # .app attendu par la suite du workflow.)
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ÉMU Compagnon" macos/Runner/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ÉMU Compagnon" macos/Runner/Info.plist

      # Sans ceci, l'App Sandbox de macOS (activé par défaut par le
      # scaffold généré) bloque TOUTE requête réseau sortante — ce qui
      # cassait silencieusement la vérification de mise à jour de
      # contenu, le téléchargement des polices Google Fonts au premier
      # lancement, et potentiellement d'autres fonctionnalités réseau.
      # PlistBuddy (outil natif macOS) est utilisé plutôt que sed, pour
      # éditer le XML sans risquer de le corrompre.
      - name: Autoriser les requêtes réseau sortantes (App Sandbox)
        run: |
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if ! /usr/libexec/PlistBuddy -c "Print :com.apple.security.network.client" "$f" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f"
            fi
          done

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        shell: bash
        run: |
          set +e
          dart run flutter_launcher_icons -f icons-macos.yaml > icon_gen.log 2>&1
          status=$?
          cat icon_gen.log
          if [ $status -ne 0 ]; then
            {
              echo '### Diagnostic : erreur de génération des icônes'
              echo '```'
              cat icon_gen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Publier le log de génération des icônes (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-gen-log-macos
          path: icon_gen.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Construire l'app macOS
        run: flutter build macos --release

      # Note : cette app n'est pas signée avec un certificat Apple
      # Developer — utilisable en local/interne, mais macOS Gatekeeper
      # affichera un avertissement à l'ouverture pour un tiers non averti.
      # La signature notariée Apple est une démarche séparée, similaire
      # à ce qu'on a fait pour Android (nécessite un compte payant
      # Apple Developer, 99$/an).
      - name: Publier l'app macOS comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-macos
          path: build/macos/Build/Products/Release/*.app
          retention-days: 30

  # Crée automatiquement une Release GitHub avec l'APK attaché
  # quand tu pousses un tag de version, ex. : git tag v1.0.0 && git push --tags
  release:
    name: Créer une Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          # Version figée : un build d'aujourd'hui doit rester reproductible
          # demain. Pour mettre à jour Flutter, changer ce numéro
          # volontairement (et relire les résultats des tests).
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Générer les dossiers natifs (android/ios) si absents
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,ios,web --org com.emucompagnon --project-name emu_compagnon /tmp/scaffold
            cp -r /tmp/scaffold/android .
            cp -r /tmp/scaffold/ios .
            cp -r /tmp/scaffold/web .
            chmod +x android/gradlew
          fi
          # NB : on ne force plus manuellement les versions AGP/Kotlin/Gradle.
          # Le scaffold fraîchement généré par ce Flutter (channel stable)
          # embarque déjà des versions mutuellement compatibles — les forcer
          # à des versions plus anciennes créait des combinaisons invalides
          # et des échecs en cascade.
          # Nom affiché sous l'icône et dans la liste des applications.
          # flutter create y met le nom technique du projet
          # ("emu_compagnon") ; on le remplace par le vrai nom de l'app.
          sed -i 's/android:label="[^"]*"/android:label="ÉMU Compagnon"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          # Ajoute la permission POST_NOTIFICATIONS (Android 13+), requise
          # par flutter_local_notifications et non ajoutée automatiquement
          # au scaffold généré par flutter create.
          if ! grep -q "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>#' android/app/src/main/AndroidManifest.xml
          fi
          # Ajoute la permission INTERNET. Flutter ne l'ajoute PAS par
          # défaut au manifeste de release (seulement au manifeste de
          # debug, pour le VM service) — un développeur doit la déclarer
          # lui-même. Sans elle, TOUT appel réseau de l'app (vérification
          # de mise à jour du contenu, téléchargement des polices Google
          # Fonts au premier lancement, etc.) est bloqué par le système,
          # ce qui peut faire planter l'app au démarrage si l'erreur n'est
          # pas interceptée. C'était absent du manifeste de la version
          # envoyée en production (confirmé en inspectant les permissions
          # réelles de l'APK buildé par ce workflow).
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          fi
          # Active le "core library desugaring", requis par
          # flutter_local_notifications (utilise des API Java 8+) et
          # jamais activé par défaut dans le scaffold généré.
          if ! grep -q "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          fi
          # NB : la version de file_picker utilisée (>=10.3.10, voir
          # pubspec.yaml) référence déjà "flutter.compileSdkVersion"
          # dynamiquement — plus besoin de patcher le compileSdk ici.
          # Les versions antérieures (8.x) le figeaient en dur à 34,
          # ce qui cassait la compilation avec les plugins récents
          # (ex. flutter_plugin_android_lifecycle exigeant 36) sans
          # qu'aucune configuration Gradle de notre côté ne puisse le
          # corriger — la vraie source du problème était la version du
          # package, pas la configuration.

      - name: Configurer la signature de production (si les secrets existent)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Vérification "si les secrets existent" faite ici, en bash, et
          # non via un "if:" YAML au niveau de l'étape (GitHub Actions
          # refuse "secrets" dans une expression if: d'étape).
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/emu-compagnon-release.jks
            cat > android/key.properties << PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=emu-compagnon-release.jks
          PROPS

            sed -i '1i\
          import java.util.Properties\
          import java.io.FileInputStream\
          ' android/app/build.gradle.kts

            sed -i '/^android {/i\
          val keystorePropertiesFile = rootProject.file("key.properties")\
          val keystoreProperties = Properties()\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }\
          ' android/app/build.gradle.kts

            sed -i '/^android {/a\
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties["keyAlias"] as String?\
                      keyPassword = keystoreProperties["keyPassword"] as String?\
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }\
                      storePassword = keystoreProperties["storePassword"] as String?\
                  }\
              }' android/app/build.gradle.kts

            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' android/app/build.gradle.kts
          else
            echo "Aucun secret de signature trouvé — build signé avec la clé de debug."
          fi

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        shell: bash
        run: |
          set +e
          dart run flutter_launcher_icons -f icons-android.yaml > icon_gen.log 2>&1
          status=$?
          cat icon_gen.log
          if [ $status -ne 0 ]; then
            {
              echo '### Diagnostic : erreur de génération des icônes'
              echo '```'
              cat icon_gen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Publier le log de génération des icônes (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-gen-log-android-release
          path: icon_gen.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Créer la Release avec l'APK attaché
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
