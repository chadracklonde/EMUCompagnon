name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (release)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Générer les dossiers natifs (android/ios) si absents
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,ios --org com.emucompagnon --project-name emu_compagnon /tmp/scaffold
            cp -r /tmp/scaffold/android .
            cp -r /tmp/scaffold/ios .
            chmod +x android/gradlew
          fi

      - name: Vérifier l'environnement
        run: flutter doctor -v

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        run: dart run flutter_launcher_icons

      - name: Analyser le code (non bloquant)
        run: flutter analyze || true

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Construire l'App Bundle (pour le Play Store)
        run: flutter build appbundle --release

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publier l'App Bundle comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  release:
    name: Créer une Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Générer les dossiers natifs (android/ios) si absents
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android,ios --org com.emucompagnon --project-name emu_compagnon /tmp/scaffold
            cp -r /tmp/scaffold/android .
            cp -r /tmp/scaffold/ios .
            chmod +x android/gradlew
          fi

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        run: dart run flutter_launcher_icons

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Créer la Release avec l'APK attaché
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
