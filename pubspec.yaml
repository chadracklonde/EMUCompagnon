name: emu_compagnon
description: "ÉMU Compagnon — Bible, Cantiques, Dictionnaire biblique et Liturgie EMU"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^0.4.2+2
  # Bundles a real sqlite3 native library for every platform. Without
  # this, sqflite_common_ffi has no bundled sqlite3.dll on Windows release
  # builds (the docs are explicit about this — debug mode works by
  # accident, release mode silently fails to open any database), which
  # breaks essentially every feature in the app on Windows.
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  share_plus: ^12.0.0
  http: ^1.2.2
  file_picker: ^10.3.10
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  just_audio: ^0.9.42
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# flutter_launcher_icons ^0.14.1 depends on image ^4.2.0, which transitively
# pulls in archive ^3.4.x. That version of `archive` calls
# UnmodifiableUint8ListView (lib/src/bzip2/bz2_bit_reader.dart), a Dart
# core-library symbol that current Dart SDKs no longer resolve, so the
# process dies with "Method not found: 'UnmodifiableUint8ListView'." —
# but only lazily, the first time a code path that actually touches that
# codec runs. That's exactly why `dart run flutter_launcher_icons` built
# Android icons fine while failing on the Windows/macOS jobs' identical
# command: each platform's icon generation exercises a different part of
# the `image`/`archive` pipeline. Pinning a patched 3.x `archive` (the
# last release before its 4.0.0 API break, which `image` ^4.2.0 isn't
# written against) is the documented fix —
# https://github.com/fluttercommunity/flutter_launcher_icons/issues/593.
dependency_overrides:
  archive: ^3.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/icons/
    - assets/images/

# Generates native iOS/Android/Windows/macOS launcher icons from a single
# source image. Run once after `flutter pub get`:  dart run flutter_launcher_icons
# NB : la configuration flutter_launcher_icons ne vit plus ici — elle est
# scindée en 3 fichiers séparés à la racine du projet
# (flutter_launcher_icons-android.yaml, -windows.yaml, -macos.yaml),
# chacun invoqué avec -f dans l'étape CI correspondante. Un seul bloc
# combiné ici causait un échec systématique sur Windows/macOS : l'outil
# lit TOUTE la config d'un coup (y compris android: true) et tente
# d'écrire dans android/app/src/main/AndroidManifest.xml même dans les
# jobs où ce dossier n'existe jamais.
