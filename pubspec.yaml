name: emu_compagnon
description: "ÉMU Compagnon — Bible, Cantiques, Dictionnaire biblique et Liturgie EMU"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  share_plus: ^12.0.0
  http: ^1.2.2
  file_picker: ^10.3.10
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/icons/
    - assets/images/

# Generates native iOS/Android launcher icons from a single source image.
# Run once after `flutter pub get`:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7A2426"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
