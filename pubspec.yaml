name: emu_compagnon
description: "ÉMU Compagnon — Bible, Cantiques, Dictionnaire biblique et Liturgie EMU"
publish_to: 'none'
version: 1.1.2+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^0.4.2+2
  # Bundles a real sqlite3 native library for every platform. Without
  # this, sqflite_common_ffi has no bundled sqlite3.dll on Windows release
  # builds (the docs are explicit about this — debug mode works by
  # accident, release mode silently fails to open any database), which
  # breaks essentially every feature in the app on Windows.
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  share_plus: ^12.0.0
  http: ^1.2.2
  file_picker: ^10.3.10
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/icons/
    - assets/images/
    - assets/fonts/PlayfairDisplay-OFL.txt
  fonts:
    # Playfair Display (SIL OFL 1.1) embarquée : plus aucun téléchargement
    # de police au runtime. Police variable (axe de graisse 400-900).
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VF.ttf

# Generates native iOS/Android/Windows/macOS launcher icons from a single
# source image. Run once after `flutter pub get`:  dart run flutter_launcher_icons
# NB : la configuration flutter_launcher_icons ne vit plus ici — elle est
# scindée en 3 fichiers séparés à la racine du projet
# (icons-android.yaml, icons-windows.yaml, icons-macos.yaml), chacun
# invoqué avec -f dans l'étape CI correspondante.
#
# IMPORTANT — ne JAMAIS nommer ces fichiers "flutter_launcher_icons-*.yaml" :
# dès qu'un fichier matchant ce motif existe à la racine du projet,
# flutter_launcher_icons (v0.14.x) bascule silencieusement en mode
# "flavors" et IGNORE complètement le flag -f — il traite alors chaque
# suffixe ("android", "windows", "macos"...) comme le nom d'un flavor
# Gradle et écrit les icônes Android dans
# android/app/src/<flavor>/res/... au lieu de android/app/src/main/res/.
# Comme notre projet n'a aucun flavor Gradle de ce nom, ces fichiers sont
# écrits dans un dossier jamais compilé : l'icône par défaut de Flutter
# dans src/main/res/ n'est jamais remplacée, et l'app shippée garde le
# logo Flutter générique — bug confirmé en extrayant et inspectant l'APK
# réellement envoyé sur le Play Store (ic_launcher.png = logo Flutter
# stock) après que l'étape CI ait pourtant rapporté un succès (exit 0).
# C'est pourquoi ces fichiers sont nommés "icons-*.yaml" et non
# "flutter_launcher_icons-*.yaml".
